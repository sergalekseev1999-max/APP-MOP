<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP MOPS</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP MOPS">
  <meta name="theme-color" content="#09090b">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .safe-wrapper {
      width: 100vw; height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e3a8a, #000000);
      color: #e2e8f0;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    #loading p { font-size: 14px; color: #94a3b8; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: "7532f76f-7626-48db-b957-8b7fa626109e"
      });
    });
  </script>
</head>
<body>
  <div class="safe-wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <p>Запуск приложения...</p>
    </div>
    <iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; geolocation" style="flex:1; width:100%; border:none; display:block;"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('SW зарегистрирован.');
            registration.update();
          })
          .catch(err => console.log('Подключение SW провалилось:', err));
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      var iframe = document.getElementById("app");
      var baseUrl = "https://script.google.com/macros/s/AKfycbxBZPKys2bSUk6heqbQyHBIAbaOFd7TscW10mAg0o-ZEFQ35HOd4vcUEgS98Xb_NSz1LA/exec";
      
      iframe.onload = function() {
        document.getElementById("loading").style.display = "none";
      };

      function loadApp() {
        var params = window.location.search || '';
        var separator = params ? "&" : "?";
        iframe.src = baseUrl + params + separator + "nocache=" + Date.now();
      }
      
      loadApp();
    });

    // Невидимый перехватчик первого клика (требование Apple для выдачи пушей)
    window.OneSignalDeferred.push(function(OneSignal) {
        var overlay = document.createElement('div');
        overlay.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:2147483647; background:transparent;";
        
        function requestPush() {
            overlay.remove(); // Сразу убираем невидимый экран
            try {
                if (window.Notification && window.Notification.permission === 'default') {
                    window.Notification.requestPermission().then(function(p) {
                        if (p === 'granted' && window.OneSignal) {
                            OneSignal.User.PushSubscription.optIn();
                        }
                    });
                } else {
                    OneSignal.Slidedown.promptPush();
                }
            } catch(e) {}
        }
        
        // Перехватываем либо клик, либо касание (на Айфоне)
        overlay.addEventListener('click', requestPush);
        overlay.addEventListener('touchstart', requestPush);
        
        // Проверяем, подписаны ли мы уже. Если нет — вешаем экран.
        if (!OneSignal.User.PushSubscription.optedIn) {
            document.body.appendChild(overlay);
        }
    });
  </script>
</body>
</html>
