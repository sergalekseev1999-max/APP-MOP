<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP MOPS</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP MOPS">
  <meta name="theme-color" content="#09090b">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .safe-wrapper {
      width: 100vw; height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e3a8a, #000000);
      color: #e2e8f0;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    #loading p { font-size: 14px; color: #94a3b8; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "7532f76f-7626-48db-b957-8b7fa626109e",
        notifyButton: {
          enable: true, 
          position: 'bottom-right',
          text: {
            'tip.state.unsubscribed': 'Подписаться на уведомления',
            'tip.state.subscribed': 'Вы подписаны',
            'tip.state.blocked': 'Уведомления заблокированы'
          }
        }
      });
      
      OneSignal.Slidedown.promptPush();

      OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          if(OneSignal.User.PushSubscription.optedIn) {
              alert("✅ ПУШИ УСПЕШНО ПОДКЛЮЧЕНЫ!");
          }
      });
    });
  </script>
</head>
<body>
  <div class="safe-wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <p>Запуск приложения...</p>
    </div>
    <iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; geolocation" style="flex:1; width:100%; border:none; display:block;"></iframe>
  </div>

  <script>

    var safeStorage = {
        data: {},
        getItem: function(key) {
            try { return safeStorage.getItem(key); }
            catch(e) { return this.data[key] || null; }
        },
        setItem: function(key, val) {
            try { safeStorage.setItem(key, val); }
            catch(e) { this.data[key] = String(val); }
        },
        removeItem: function(key) {
            try { safeStorage.removeItem(key); }
            catch(e) { delete this.data[key]; }
        }
    };

    // ============================================================
    // ДВУХУРОВНЕВАЯ АВТОРИЗАЦИЯ
    // ============================================================
    // Домен github.io СТАБИЛЕН — localStorage здесь НИКОГДА не теряется.
    // Домен googleusercontent.com (GAS iframe) НЕСТАБИЛЕН — поддомен
    // меняется при каждом деплое, localStorage теряется.
    //
    // Поэтому userId хранится ЗДЕСЬ (в оболочке PWA) и передаётся
    // в iframe через URL параметр uid=XXX при каждой загрузке.
    // Iframe сообщает о логине/выходе через postMessage.
    // ============================================================

    var GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbxBZPKys2bSUk6heqbQyHBIAbaOFd7TscW10mAg0o-ZEFQ35HOd4vcUEgS98Xb_NSz1LA/exec";

    // Построить URL для iframe с нужными параметрами
    function buildIframeUrl(extraParams) {
      var parts = [];
      
      // Параметры из адресной строки (пуш-уведомления и т.д.)
      var locationParams = extraParams || window.location.search || '';
      if (locationParams && locationParams.charAt(0) === '?') {
        parts.push(locationParams.substring(1));
      } else if (locationParams) {
        parts.push(locationParams);
      }

      // userId из localStorage оболочки → в URL параметр uid
      var savedUserId = safeStorage.getItem('pwa_user_id') || '';
      if (savedUserId) {
        parts.push('uid=' + encodeURIComponent(savedUserId));
      }

      // Антикэш
      parts.push('nocache=' + Date.now());

      return GAS_BASE_URL + '?' + parts.join('&');
    }

    document.addEventListener("DOMContentLoaded", function () {
      var iframe = document.getElementById("app");
      
      iframe.onload = function() {
        document.getElementById("loading").style.display = "none";
      };

      // Загрузка приложения
      iframe.src = buildIframeUrl();

      // ============================================================
      // СЛУШАЕМ postMessage ОТ IFRAME (логин / выход)
      // ============================================================
      window.addEventListener('message', function(event) {
        if (!event.data || !event.data.type) return;

        if (event.data.type === 'AUTH_LOGIN' && event.data.userId) {
          // Пользователь залогинился в iframe → сохраняем в НАШЕ хранилище
          safeStorage.setItem('pwa_user_id', String(event.data.userId));
        }

        if (event.data.type === 'AUTH_LOGOUT') {
          // Пользователь вышел из iframe → удаляем из НАШЕГО хранилища
          safeStorage.removeItem('pwa_user_id');
        }
      });

      // ============================================================
      // Обработка глубоких ссылок от SW при клике на пуш-уведомление
      // ============================================================
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'PUSH_NAVIGATE') {
            var pushParams = event.data.params || '';
            // Отправляем команду внутрь GAS iframe без его перезагрузки
            if (iframe && iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                type: 'PWA_PUSH_ACTION',
                params: pushParams
              }, '*');
            }
          }
        });
      }

      // Принудительное обновление Service Worker при каждом запуске
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(function(reg) {
            // Проверяем обновления SW немедленно
            reg.update();
          })
          .catch(function() {});
      }
    });
  </script>
</body>
</html>
