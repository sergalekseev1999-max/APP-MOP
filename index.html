<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP MOPS</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP MOPS">
  <meta name="theme-color" content="#09090b">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .safe-wrapper {
      width: 100vw; height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e3a8a, #000000);
      color: #e2e8f0;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    #loading p { font-size: 14px; color: #94a3b8; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .retry-btn {
      margin-top: 20px; padding: 14px 32px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 15px rgba(59,130,246,0.4);
    }
  </style>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    try {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          await OneSignal.init({
            appId: "7532f76f-7626-48db-b957-8b7fa626109e",
            notifyButton: {
              enable: true, 
              position: 'bottom-right',
              text: {
                'tip.state.unsubscribed': 'Подписаться на уведомления',
                'tip.state.subscribed': 'Вы подписаны',
                'tip.state.blocked': 'Уведомления заблокированы'
              }
            }
          });
          OneSignal.Slidedown.promptPush();
          OneSignal.User.PushSubscription.addEventListener("change", function(event) {
              if(OneSignal.User.PushSubscription.optedIn) {
                  alert("✅ ПУШИ УСПЕШНО ПОДКЛЮЧЕНЫ!");
              }
          });
        } catch(e) { console.error('OneSignal init error:', e); }
      });
    } catch(e) { console.error('OneSignal setup error:', e); }
  </script>
</head>
<body>
  <div class="safe-wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <p id="loading-text">Запуск приложения...</p>
    </div>
    <iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; geolocation; storage-access" style="flex:1; width:100%; border:none; display:block;"></iframe>
  </div>

  <script>

    var safeStorage = {
        data: {},
        getItem: function(key) {
            try { return window.localStorage.getItem(key); }
            catch(e) { return this.data[key] || null; }
        },
        setItem: function(key, val) {
            try { window.localStorage.setItem(key, val); }
            catch(e) { this.data[key] = String(val); }
        },
        removeItem: function(key) {
            try { window.localStorage.removeItem(key); }
            catch(e) { delete this.data[key]; }
        }
    };

    var GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbxBZPKys2bSUk6heqbQyHBIAbaOFd7TscW10mAg0o-ZEFQ35HOd4vcUEgS98Xb_NSz1LA/exec";

    function buildIframeUrl(extraParams) {
      var parts = [];
      var locationParams = extraParams || window.location.search || '';
      if (locationParams && locationParams.charAt(0) === '?') {
        parts.push(locationParams.substring(1));
      } else if (locationParams) {
        parts.push(locationParams);
      }
      var savedUserId = safeStorage.getItem('pwa_user_id') || '';
      if (savedUserId) {
        parts.push('uid=' + encodeURIComponent(savedUserId));
      }
      parts.push('nocache=' + Date.now());
      return GAS_BASE_URL + '?' + parts.join('&');
    }

    document.addEventListener("DOMContentLoaded", function () {
      var iframe = document.getElementById("app");
      var loadingEl = document.getElementById("loading");
      var loadingText = document.getElementById("loading-text");
      var iframeLoaded = false;
      var retryCount = 0;
      var maxRetries = 3;
      var appUrl = buildIframeUrl();

      // === HEARTBEAT: GAS page sends postMessage when alive ===
      var heartbeatReceived = false;
      window.addEventListener('message', function(event) {
        if (!event.data || !event.data.type) return;

        // Heartbeat from GAS page
        if (event.data.type === 'GAS_HEARTBEAT') {
          heartbeatReceived = true;
        }

        // Auth events
        if (event.data.type === 'AUTH_LOGIN' && event.data.userId) {
          safeStorage.setItem('pwa_user_id', String(event.data.userId));
        }
        if (event.data.type === 'AUTH_LOGOUT') {
          safeStorage.removeItem('pwa_user_id');
        }
      });

      iframe.onload = function() {
        iframeLoaded = true;
        // Don't hide loading yet — wait for heartbeat from GAS
        // or hide after a short delay
        setTimeout(function() {
          loadingEl.style.display = "none";
        }, 1500);
      };

      function tryLoadIframe() {
        retryCount++;
        loadingText.textContent = retryCount > 1 ? 'Повторная загрузка (' + retryCount + ')...' : 'Запуск приложения...';
        iframeLoaded = false;
        heartbeatReceived = false;
        iframe.src = buildIframeUrl();
      }

      // Initial load
      tryLoadIframe();

      // === AUTO-RETRY: if no heartbeat after 10s, reload iframe ===
      setInterval(function() {
        if (!heartbeatReceived && retryCount <= maxRetries) {
          // No heartbeat — iframe content is dead, retry
          tryLoadIframe();
        }
      }, 10000);

      // === FALLBACK: after all retries, show manual button ===
      setTimeout(function() {
        if (!heartbeatReceived) {
          loadingEl.innerHTML = 
            '<p style="font-size:16px;color:#e2e8f0;font-weight:bold;text-align:center;margin-bottom:8px;">Не удалось загрузить</p>' +
            '<p style="font-size:12px;color:#94a3b8;text-align:center;max-width:280px;margin-bottom:16px;">Попробуйте перезагрузить</p>' +
            '<button class="retry-btn" onclick="location.reload()">🔄 Перезагрузить</button>';
          loadingEl.style.display = "flex";
        }
      }, 35000);

      // Deep links from SW
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'PUSH_NAVIGATE') {
            var pushParams = event.data.params || '';
            if (iframe && iframe.contentWindow) {
              iframe.contentWindow.postMessage({
                type: 'PWA_PUSH_ACTION',
                params: pushParams
              }, '*');
            }
          }
        });
      }

      // Register SW
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
          .then(function(reg) { reg.update(); })
          .catch(function() {});
      }
    });
  </script>
</body>
</html>
