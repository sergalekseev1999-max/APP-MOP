<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP MOPS</title>
  
  <link rel="manifest" href="manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP MOPS">
  <meta name="theme-color" content="#16161a">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #16161a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .safe-wrapper {
      width: 100vw; height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e3a8a, #16161a);
      color: #e2e8f0;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    #loading p { font-size: 14px; color: #94a3b8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div class="safe-wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <p>Запуск APP MOPS Витрина...</p>
    </div>
    
    <iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; geolocation" style="flex:1; width:100%; border:none; display:block;"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('SW зарегистрирован.');
            registration.update();
          })
          .catch(err => console.log('Ошибка SW:', err));
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      var iframe = document.getElementById("app");
      // Уникальная ссылка-вебхук на Google Apps Script (FINAL_INDEX)
      var baseUrl = "https://script.google.com/macros/s/AKfycbxBZPKys2bSUk6heqbQyHBIAbaOFd7TscW10mAg0o-ZEFQ35HOd4vcUEgS98Xb_NSz1LA/exec";
      
      iframe.onload = function() {
        document.getElementById("loading").style.display = "none";
      };

      function loadApp() {
        iframe.src = baseUrl + "?nocache=" + Date.now();
      }
      
      loadApp();
    });
  </script>
</body>
</html>
