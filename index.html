<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APP MOPS</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APP MOPS">
  <meta name="theme-color" content="#09090b">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .safe-wrapper {
      width: 100vw; height: 100vh;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at top, #1e3a8a, #000000);
      color: #e2e8f0;
      z-index: 10;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(59,130,246,0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    #loading p { font-size: 14px; color: #94a3b8; font-weight: bold; }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
  
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: "7532f76f-7626-48db-b957-8b7fa626109e",
        notifyButton: {
          enable: true,
          size: "medium",
          position: "bottom-right",
          theme: "default",
          text: {
            "tip.state.unsubscribed": "🔔 Включить оповещения для МОПов",
            "tip.state.subscribed": "✅ PUSH-оповещения включены",
            "tip.state.blocked": "Вы заблокировали уведомления",
            "message.prenotify": "Нажмите, чтобы получать логи и чеки",
            "message.action.subscribed": "Спасибо за подписку!",
            "message.action.resubscribe": "Включить",
            "message.action.unsubscribe": "Отключить оповещения"
          }
        },
      });
    });
  </script>
</head>
<body>
  <div class="safe-wrapper">
    <div id="loading">
      <div class="spinner"></div>
      <p>Запуск приложения...</p>
    </div>
    <iframe id="app" allow="camera; microphone; clipboard-read; clipboard-write; geolocation" style="flex:1; width:100%; border:none; display:block;"></iframe>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('SW зарегистрирован.');
            registration.update();
          })
          .catch(err => console.log('Подключение SW провалилось:', err));
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      var iframe = document.getElementById("app");
      var baseUrl = "https://script.google.com/macros/s/AKfycbxBZPKys2bSUk6heqbQyHBIAbaOFd7TscW10mAg0o-ZEFQ35HOd4vcUEgS98Xb_NSz1LA/exec";
      
      iframe.onload = function() {
        document.getElementById("loading").style.display = "none";
      };

      function loadApp() {
        var params = window.location.search || '';
        var separator = params ? "&" : "?";
        iframe.src = baseUrl + params + separator + "nocache=" + Date.now();
      }
      
      loadApp();
    });

    // Custom UI for Apple
    window.OneSignalDeferred.push(function(OneSignal) {
      OneSignal.User.PushSubscription.addEventListener("change", function(current) {
         if(current && current.optedIn) {
            var btn = document.getElementById("custom-push-btn");
            if (btn) btn.style.display = 'none';
         }
      });
      if (!OneSignal.User.PushSubscription.optedIn) {
          var btn = document.createElement("button");
          btn.id = "custom-push-btn";
          btn.innerHTML = "🔔 Включить оповещения";
          btn.style.cssText = "position:fixed; bottom: 85px; right: 15px; z-index: 999999; padding: 12px 18px; background: rgba(59,130,246,0.9); color: white; border-radius: 50px; border: 1px solid rgba(255,255,255,0.3); font-weight: bold; font-family: sans-serif; box-shadow: 0 4px 15px rgba(59,130,246,0.5); backdrop-filter: blur(10px); cursor: pointer;";
          document.body.appendChild(btn);
          btn.onclick = function() {
             OneSignal.Slidedown.promptPush();
          };
      }
    });
  </script>
</body>
</html>
